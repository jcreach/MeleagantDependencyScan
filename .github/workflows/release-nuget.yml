name: Release NuGet Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Build, Test & Publish NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          include-prerelease: true

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Extracted version: ${VERSION}"

      - name: Restore dependencies
        run: dotnet restore Src/MeleagantDependencyScan.sln

      - name: Build solution
        run: dotnet build Src/MeleagantDependencyScan.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Src/MeleagantDependencyScan.sln --configuration Release --no-build --verbosity normal

      - name: Create NuGet package
        run: |
          dotnet pack Src/MeleagantDependencyScan/MeleagantDependencyScan.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            /p:Version=${{ env.VERSION }}

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
