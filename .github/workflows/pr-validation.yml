name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore Src/MeleagantDependencyScan.sln

      - name: Build solution
        run: dotnet build Src/MeleagantDependencyScan.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Src/MeleagantDependencyScan.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
